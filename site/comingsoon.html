<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hive Plus X</title>
<meta name="description" content="Hive Plus X は、養蜂のためのオープンソースIoTプロジェクトです。">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg:#FAF8F3; --text:#1F2328; --sub:#5B6168; --honey:#F2A900; --line:rgba(31,35,40,.12); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#2F5D45; --text:#FFFFFF; --sub:rgba(255,255,255,.72); --line:rgba(255,255,255,.22); }
  }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--text);
    font-family:"Inter","Helvetica Neue",Arial,"Hiragino Sans","Noto Sans JP",sans-serif;
    display:flex; flex-direction:column; min-height:100vh; padding:24px 16px;
    -webkit-font-smoothing:antialiased;
  }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .logo { width:min(420px, 72vw); height:auto; }
  .logo-dark { display:none; }
  @media (prefers-color-scheme: dark) { .logo-light { display:none; } .logo-dark { display:block; } }
  .tag { margin-top:28px; font-size:15px; letter-spacing:.04em; color:var(--sub); line-height:1.8; }
  .soon {
    margin-top:44px; display:inline-flex; align-items:center; gap:12px;
    font-size:12px; font-weight:600; letter-spacing:.32em; text-transform:uppercase;
  }
  .soon::before, .soon::after { content:""; width:28px; height:1px; background:var(--line); }
  .hex { width:9px; height:10px; background:var(--honey); clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
  @media (prefers-reduced-motion: reduce) { .hex { animation:none; } }
  footer { text-align:center; font-size:12px; color:var(--sub); letter-spacing:.04em; }
</style>
</head>
<body>
<main>
  <h1>
    <img class="logo logo-light" src="img/hivex_main.svg" alt="Hive Plus X">
    <img class="logo logo-dark" src="img/hivex_reverse.svg" alt="Hive Plus X">
  </h1>
  <p class="tag">養蜂のための、オープンソースIoT<br>Open-source IoT for beekeeping</p>
  <p class="soon"><span class="hex" aria-hidden="true"></span>Coming soon</p>
</main>
<footer>&copy; 2026 Hive Plus X</footer>
</body>
</html>
